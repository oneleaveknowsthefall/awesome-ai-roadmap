site_name: Awesome AI Roadmap
site_description: 面向 AI 工程面试准备，梳理 LLM、多模态、Tools、Agent、RAG、框架、LLMOps、安全治理与 FDE 的原理和工程取舍
site_author: Polo Li
site_url: https://zongyangbigpolo.github.io/awesome-ai-roadmap/
repo_url: https://github.com/zongyangbigpolo/awesome-ai-roadmap
repo_name: zongyangbigpolo/awesome-ai-roadmap
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - git-revision-date-localized:
      type: iso_date
      timezone: Asia/Shanghai
      locale: zh
      enable_creation_date: true
      enable_git_follow: false
      strict: true
  - redirects:
      redirect_maps:
        langchain/README.md: frameworks/01-langchain/README.md
        langchain/01-foundations/README.md: frameworks/01-langchain/01-foundations/README.md
        langchain/01-foundations/01-agent-frameworks.md: frameworks/01-langchain/01-foundations/01-agent-frameworks.md
        langchain/01-foundations/02-chain-and-lcel.md: frameworks/01-langchain/01-foundations/02-chain-and-lcel.md
        langchain/01-foundations/03-langchain-architecture.md: frameworks/01-langchain/01-foundations/03-langchain-architecture.md
        langchain/02-agent-building/README.md: frameworks/01-langchain/02-agent-building/README.md
        langchain/02-agent-building/04-build-agent.md: frameworks/01-langchain/02-agent-building/04-build-agent.md
        langchain/02-agent-building/05-tool-registration.md: frameworks/01-langchain/02-agent-building/05-tool-registration.md
        langchain/02-agent-building/06-memory.md: frameworks/01-langchain/02-agent-building/06-memory.md
        langchain/03-ecosystem/README.md: frameworks/01-langchain/03-ecosystem/README.md
        langchain/03-ecosystem/07-langchain-vs-llamaindex.md: frameworks/01-langchain/03-ecosystem/07-langchain-vs-llamaindex.md
        langchain/03-ecosystem/08-langchain4j.md: frameworks/01-langchain/03-ecosystem/08-langchain4j.md
        langchain/03-ecosystem/11-version-evolution.md: frameworks/01-langchain/03-ecosystem/11-version-evolution.md
        langchain/04-langgraph/README.md: frameworks/01-langchain/04-langgraph/README.md
        langchain/04-langgraph/09-langchain-vs-langgraph.md: frameworks/01-langchain/04-langgraph/09-langchain-vs-langgraph.md
        langchain/04-langgraph/10-langgraph-advantages.md: frameworks/01-langchain/04-langgraph/10-langgraph-advantages.md
        langchain/05-production/README.md: frameworks/01-langchain/05-production/README.md
        langchain/05-production/12-deep-research.md: frameworks/01-langchain/05-production/12-deep-research.md
        langchain/05-production/13-langsmith-production-loop.md: frameworks/01-langchain/05-production/13-langsmith-production-loop.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/mkdocs_hooks.py

copyright: 文档内容采用 CC BY 4.0 许可，由 Polo Li 维护

extra:
  author:
    name: Polo Li
    url: https://github.com/zongyangbigpolo
  seo:
    google_site_verification: "Tbgg-w7R1iywQ8r0Mp868731_XNo6up5vWyclB5GVBw"
    bing_site_verification: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zongyangbigpolo/awesome-ai-roadmap
      name: Awesome AI Roadmap on GitHub

