{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page %}
    <meta property="og:locale" content="zh_CN">
    <meta property="og:type" content="{{ page.meta.seo_page_type }}">
    <meta property="og:site_name" content="{{ config.site_name }}">
    <meta property="og:title" content="{{ page.meta.seo_headline or page.title }}">
    <meta property="og:description" content="{{ page.meta.description or config.site_description }}">
    <meta property="og:url" content="{{ page.meta.seo_canonical_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.meta.seo_headline or page.title }}">
    <meta name="twitter:description" content="{{ page.meta.description or config.site_description }}">
    {% if config.extra.seo.google_site_verification %}
      <meta name="google-site-verification" content="{{ config.extra.seo.google_site_verification }}">
    {% endif %}
    {% if config.extra.seo.bing_site_verification %}
      <meta name="msvalidate.01" content="{{ config.extra.seo.bing_site_verification }}">
    {% endif %}
    {% for schema in page.meta.seo_json_ld %}
      <script type="application/ld+json">{{ schema | safe }}</script>
    {% endfor %}
  {% endif %}
{% endblock %}
